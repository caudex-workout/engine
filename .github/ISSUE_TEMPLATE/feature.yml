name: Feature request
description: Propose a focused, host-useful improvement
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem and host use case}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed behavior and affected surface}
    validations: {required: true}
  - type: textarea
    id: compatibility
    attributes: {label: Determinism, explainability, compatibility, and persistence-boundary impact}
    validations: {required: true}
