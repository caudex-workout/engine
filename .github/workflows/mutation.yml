name: Methodology mutation testing

on:
  workflow_dispatch:
    inputs:
      mutation_id:
        description: Optional mutation ID; leave empty for the full suite
        required: false
        type: string

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@272b55e6c4fcef353f6d923050ff32f018636378 # node24 runtime update
        with:
          version: 0.16.0
      - name: Run curated mutation suite
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n '${{ inputs.mutation_id }}' ]]; then
            zig build mutation-test -- --id '${{ inputs.mutation_id }}'
          else
            zig build mutation-test
          fi
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: .zig-cache/mutation/report.json
          if-no-files-found: error
          retention-days: 14
