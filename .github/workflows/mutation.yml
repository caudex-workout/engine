name: Methodology mutation testing

on:
  workflow_dispatch:
    inputs:
      mutation_id:
        description: Optional mutation ID; leave empty for the full suite
        required: false
        type: string

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Run curated mutation suite
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n '${{ inputs.mutation_id }}' ]]; then
            zig build mutation-test -- --id '${{ inputs.mutation_id }}'
          else
            zig build mutation-test
          fi
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-report
          path: .zig-cache/mutation/report.json
          if-no-files-found: error
          retention-days: 14
