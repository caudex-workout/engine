name: Required CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality and fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run fast checks
        run: zig build check-fast --summary all
      - name: Write summary
        if: always()
        run: |
          {
            echo '### Quality'
            echo '- `zig build check-fast` is the fast local guardrail.'
          } >> "$GITHUB_STEP_SUMMARY"

  canonical-check:
    name: Canonical pull-request check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/npm/workout-engine/package-lock.json
      - name: Install locked JavaScript test tools
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: packages/npm/workout-engine
      - name: Install persistence adapter workspace links
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: packages/persistence-indexeddb
      - name: Run canonical check
        run: zig build check --summary all
      - name: Write summary
        if: always()
        run: |
          {
            echo '### Canonical check'
            echo '- `zig build check` is the branch-protection candidate.'
            echo '- Required subsystems: core, contracts, methodologies, adapters, C/WASM/npm consumers, CLI, catalog, and executable documentation.'
          } >> "$GITHUB_STEP_SUMMARY"

  native-compatibility:
    name: Native compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run native C compatibility checks
        run: zig build test-core test-c-release --summary all
      - name: Write summary
        if: always()
        shell: bash
        run: echo "- Native C compatibility completed on ${{ matrix.os }}." >> "$GITHUB_STEP_SUMMARY"
