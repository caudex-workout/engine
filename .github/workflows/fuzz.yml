name: Bounded fuzzing

on:
  workflow_dispatch:
    inputs:
      target:
        description: Fuzz target
        required: true
        type: choice
        options: [json, decimal, c-abi, cli-args, sqlite, methodology-config]
      iterations:
        description: Maximum cases (the runner caps this at 100000)
        required: true
        default: "10000"
        type: number
      seed:
        description: Reproducible integer seed
        required: true
        default: "0xca0de5f00d"
        type: string

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Run selected bounded target
        shell: bash
        run: |
          set -euo pipefail
          case '${{ inputs.target }}' in
            json) target=fuzz-json ;;
            decimal) target=fuzz-decimal ;;
            c-abi) target=fuzz-c-abi ;;
            cli-args) target=fuzz-cli-args ;;
            sqlite) target=fuzz-sqlite ;;
            methodology-config) target=fuzz-methodology-config ;;
            *) exit 2 ;;
          esac
          zig build "$target" -- --iterations='${{ inputs.iterations }}' --seed='${{ inputs.seed }}'
      - name: Upload reproducers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-reproducers
          path: .zig-cache/fuzz
          if-no-files-found: ignore
          retention-days: 7
